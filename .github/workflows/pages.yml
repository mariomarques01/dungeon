name: Publicar Dungeon Cards no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'godot/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Instalar Godot e templates Web
        env:
          GODOT_VERSION: 4.4.1
        run: |
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.zip 'templates/web*' -d /tmp/godot
          mv /tmp/godot/templates/web* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Exportar jogo Godot para navegador
        run: |
          node scripts/sync_godot_data.cjs
          mkdir -p web/godot
          godot --headless --path godot --editor --import
          godot --headless --path godot --script "$GITHUB_WORKSPACE/tests/godot_port.gd"
          godot --headless --path godot --script "$GITHUB_WORKSPACE/tests/godot_v2.gd"
          export_base="dungeon-${GITHUB_SHA:0:12}"
          godot --headless --path godot --export-release Web "../web/godot/$export_base.html"
          mv "web/godot/$export_base.html" web/godot/index.html
          test -s web/godot/index.html
          test -s "web/godot/$export_base.wasm"
          test -s "web/godot/$export_base.pck"
      - name: Preparar efeitos sonoros CC0
        run: python3 scripts/prepare_sfx.py
      - name: Validar jogo e arquivos sonoros
        run: |
          node --check web/game.js
          test -s web/index.html
          test -s web/style.css
          for sound in steel fire lightning; do
            find web/assets/sfx -maxdepth 1 -type f -name "$sound.*" -size +100c | grep -q . || exit 1
          done
      - name: Preparar arquivos do jogo
        run: |
          test -f web/index.html
          cp web/index.html web/404.html
          touch web/.nojekyll
          mkdir -p site/classic site/godot
          cp -R web/godot/. site/
          cp -R web/godot/. site/godot/
          cp -R web/. site/classic/
          rm -rf site/classic/godot
          cp site/index.html site/404.html
          touch site/.nojekyll
      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
