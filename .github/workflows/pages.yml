name: Publicar Dungeon Cards no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar efeitos sonoros CC0
        run: python3 scripts/prepare_sfx.py
      - name: Validar jogo e arquivos sonoros
        run: |
          node --check web/game.js
          test -s web/index.html
          test -s web/style.css
          for sound in steel fire lightning; do
            find web/assets/sfx -maxdepth 1 -type f -name "$sound.*" -size +100c | grep -q . || exit 1
          done
      - name: Preparar arquivos do jogo
        run: |
          test -f web/index.html
          cp web/index.html web/404.html
          touch web/.nojekyll
      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
